name: Firestore daily backup

on:
  schedule:
    # 毎日 21:00 UTC = 日本時間 6:00
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Firestore data and write snapshot
        run: node scripts/backup.mjs

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily Firestore backup $(date -u +%F)"
            git push
          fi
